spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/bento_returns
spring.datasource.username=bento
spring.datasource.password=${DB_PASSWORD}

spring.config.import=optional:file:./private.properties
app.google.credentials-path=${GOOGLE_CREDENTIALS_PATH}
app.google.returns-folder-id=${RETURNS_FOLDER_ID}

server.servlet.session.timeout=2h